<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Proyecto AWS</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        text-align: center;
        padding: 50px;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: inline-block;
      }
      h1 {
        color: #2c3e50;
      }
      p {
        color: #666;
      }
      .badge {
        background-color: #27ae60;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hola Mundo</h1>
      <p>Esta página viene desde el <span class="badge">FRONTEND</span></p>
      <hr />
      <p>Servido por Nginx en un contenedor Docker.</p>
    </div>
  </body>
</html>
