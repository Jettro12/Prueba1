name: Deploy Infrastructure and App

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # ¡Ojo con esto!
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init

      # TRUCO: Marcamos las instancias como "dañadas" (taint).
      # Esto obliga a Terraform a destruirlas y crearlas de nuevo.
      # Es necesario para que vuelvan a descargar el código nuevo de GitHub.
      - name: Force Instance Re-creation
        run: |
          # El "|| true" es para que no falle si es la primera vez que se corre
          terraform taint aws_instance.servidor_backend || true
          terraform taint aws_instance.servidor_frontend || true

      - name: Terraform Apply
        run: terraform apply -auto-approve
