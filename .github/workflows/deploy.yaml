name: Deploy Multi-Account Bulldozer

on:
  push:
    branches:
      - main

jobs:
  refresh-instances:
    name: "Update Both Accounts"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # ======================================================
      #  1. ACTUALIZAR BACKEND (CUENTA 1)
      # ======================================================
      - name: Auth AWS Backend
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.BACKEND_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.BACKEND_SECRET_KEY }}
          aws-session-token: ${{ secrets.BACKEND_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Bulldozer Script - Backend
        run: |
          # Nombre exacto que pusiste en tu main.tf para el ASG del Backend
          ASG_NAME="asg-backend-cluster"

          echo "🔧 [BACKEND] Iniciando protocolo Bulldozer..."

          # 1. Intentar cancelar refresh previo
          aws autoscaling cancel-instance-refresh --auto-scaling-group-name $ASG_NAME 2>/dev/null || echo "   ℹ️ Nada que cancelar."

          # 2. Bucle de espera (Polling)
          echo "⏳ [BACKEND] Esperando liberación del ASG..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name $ASG_NAME \
              --query 'InstanceRefreshes[0].Status' --output text)
            
            echo "   Estado actual: $STATUS"
            
            if [[ "$STATUS" == "None" || "$STATUS" == "Successful" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "✅ [BACKEND] ASG listo."
              break
            fi
            sleep 5
          done

          # 3. Lanzar actualización (MinHealthyPercentage: 0 causa una caída breve, pero es rápido)
          echo "🚀 [BACKEND] ¡Actualizando instancias!"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --preferences '{"MinHealthyPercentage": 0, "InstanceWarmup": 0}' \
            --strategy Rolling

      # ======================================================
      #  2. ACTUALIZAR FRONTEND (CUENTA 2)
      # ======================================================
      - name: Auth AWS Frontend
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.FRONTEND_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.FRONTEND_SECRET_KEY }}
          aws-session-token: ${{ secrets.FRONTEND_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Bulldozer Script - Frontend
        run: |
          # Nombre exacto que pusiste en tu main.tf para el ASG del Frontend
          ASG_NAME="asg-frontend-cluster"

          echo "🔧 [FRONTEND] Iniciando protocolo Bulldozer..."

          aws autoscaling cancel-instance-refresh --auto-scaling-group-name $ASG_NAME 2>/dev/null || echo "   ℹ️ Nada que cancelar."

          echo "⏳ [FRONTEND] Esperando liberación del ASG..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name $ASG_NAME \
              --query 'InstanceRefreshes[0].Status' --output text)
            
            echo "   Estado actual: $STATUS"
            
            if [[ "$STATUS" == "None" || "$STATUS" == "Successful" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              echo "✅ [FRONTEND] ASG listo."
              break
            fi
            sleep 5
          done

          echo "🚀 [FRONTEND] ¡Actualizando instancias!"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --preferences '{"MinHealthyPercentage": 0, "InstanceWarmup": 0}' \
            --strategy Rolling
